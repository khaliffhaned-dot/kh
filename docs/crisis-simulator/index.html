<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Sixty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>:root{color-scheme:light} body{margin:0}</style>
</head>
<body>
<style>
/* Layout concept: a situation-room console on paper. A running clock and five meters are the spine; content sits in square-cornered sheets; type carries the voice. */
:root {
  --paper: #EDF1F0;
  --sheet: #FAFBFA;
  --ink: #10222B;
  --ink-2: #455860;
  --line: #C9D4D5;
  --accent: #1F3FA8;
  --accent-ink: #FFFFFF;
  --accent-tint: #E2E8F8;
  --ok: #17795A;
  --ok-tint: #DDF0E8;
  --warn: #9A6400;
  --warn-tint: #F6EBCB;
  --bad: #B3261E;
  --bad-tint: #F7DEDB;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D171D;
    --sheet: #15232B;
    --ink: #E6EEF0;
    --ink-2: #A3B5BB;
    --line: #2B3C45;
    --accent: #93A6FF;
    --accent-ink: #0D171D;
    --accent-tint: #1D2950;
    --ok: #55C9A1;
    --ok-tint: #12332A;
    --warn: #E5B53F;
    --warn-tint: #3A2F10;
    --bad: #FF8F86;
    --bad-tint: #3C1C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D171D;
  --sheet: #15232B;
  --ink: #E6EEF0;
  --ink-2: #A3B5BB;
  --line: #2B3C45;
  --accent: #93A6FF;
  --accent-ink: #0D171D;
  --accent-tint: #1D2950;
  --ok: #55C9A1;
  --ok-tint: #12332A;
  --warn: #E5B53F;
  --warn-tint: #3A2F10;
  --bad: #FF8F86;
  --bad-tint: #3C1C1A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }

.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 5.2vw, 3.4rem); letter-spacing: -0.025em; }
h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); }
h3 { font-size: 1.15rem; }
h4 { font-size: 1rem; }
p { margin: 0 0 0.8em; max-width: 68ch; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); }
.muted { color: var(--ink-2); }
.small { font-size: 0.86rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
.brand { white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 10px; }
.brand span { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 400; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav button { background: none; border: 1px solid transparent; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-weight: 500; }
.nav button:hover { border-color: var(--line); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--paper); }

main { padding-top: 28px; }
.view > * + * { margin-top: 20px; }
.stack > * + * { margin-top: 14px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); padding: 10px 18px; border-radius: 3px; font-weight: 600; cursor: pointer; text-align: center; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink-2); }
.btn.ghost:hover { background: var(--accent-tint); filter: none; }
.btn.sm { padding: 5px 11px; font-size: 0.86rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* sheets and chips */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; min-width: 0; }
.sheet.tight { padding: 12px 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); color: var(--ink-2); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-tint); }
.chip.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-tint); }
.chip.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-tint); }
.chip.accent { color: var(--accent); border-color: var(--accent); background: var(--accent-tint); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { margin: 10px 0 14px; }
.hero .lede { font-size: 1.12rem; color: var(--ink-2); max-width: 54ch; }
.board { font-family: var(--f-mono); font-size: 0.82rem; }
.board table { width: 100%; border-collapse: collapse; }
.board td, .board th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.board th { font-weight: 500; color: var(--ink-2); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
.board .t { white-space: nowrap; color: var(--accent); }
.entry { display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; }
.entry:hover { border-color: var(--accent); }
.entry h3 { margin-top: 2px; }
.steps4 { counter-reset: s; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); padding: 0; list-style: none; margin: 16px 0 0; }
.steps4 li { border-top: 2px solid var(--ink); padding-top: 10px; }
.steps4 b { display: block; font-family: var(--f-display); font-size: 1.05rem; }
.notice { border: 1px solid var(--warn); background: var(--warn-tint); color: var(--ink); border-radius: 4px; padding: 10px 14px; font-size: 0.88rem; }
.notice b { color: var(--warn); }

/* academy */
.mod { display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
.mod:hover { border-color: var(--accent); }
.mod .n { font-family: var(--f-mono); color: var(--ink-2); font-size: 0.75rem; }
.points { padding-left: 1.1em; margin: 0; }
.points li { margin-bottom: 0.55em; max-width: 70ch; }
.quiz fieldset { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; margin: 0 0 12px; background: var(--sheet); }
.quiz legend { font-weight: 600; padding: 0 6px; }
.quiz label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 4px; cursor: pointer; }
.quiz label.right { color: var(--ok); font-weight: 600; }
.quiz label.wrong { color: var(--bad); }
.why { border-left: 0; background: var(--accent-tint); padding: 10px 12px; border-radius: 3px; margin-top: 8px; font-size: 0.92rem; }

/* tools: tree / builder / doctor / match */
.pick { display: grid; gap: 8px; }
.pick button { text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px; cursor: pointer; }
.pick button:hover { border-color: var(--accent); }
.pick button.right { border-color: var(--ok); background: var(--ok-tint); }
.pick button.wrong { border-color: var(--bad); background: var(--bad-tint); }
.pick button[disabled] { cursor: default; }
.seg { cursor: pointer; border-radius: 2px; padding: 1px 0; border-bottom: 1px dashed var(--ink-2); }
.seg.on { background: var(--warn-tint); border-bottom: 2px solid var(--warn); }
.seg.hit { background: var(--ok-tint); border-bottom: 2px solid var(--ok); }
.seg.miss { background: var(--bad-tint); border-bottom: 2px solid var(--bad); }
.seg.fp { background: var(--warn-tint); text-decoration: line-through; }
.docbox { font-size: 1.05rem; line-height: 1.9; max-width: 68ch; }
.bline { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); background: var(--sheet); border-radius: 3px; padding: 9px 12px; }
.bline button { text-align: left; background: none; border: 0; padding: 0; cursor: pointer; flex: 1; }
.slot { border: 1px dashed var(--ink-2); border-radius: 3px; padding: 9px 12px; min-height: 42px; }
select { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; max-width: 100%; }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 14px; align-items: center; }
@media (max-width: 640px) { .match { grid-template-columns: 1fr; } }
.match .lab { font-weight: 500; }

/* simulator */
.scn { display: flex; flex-direction: column; gap: 8px; }
.scn .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); padding: 8px 0; margin-bottom: 14px; }
.hud-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.clock { font-family: var(--f-mono); font-weight: 500; font-size: 1.5rem; letter-spacing: 0.02em; line-height: 1; }
.clock small { display: block; font-size: 0.68rem; color: var(--ink-2); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
.prog { flex: 1 1 140px; height: 4px; background: var(--line); border-radius: 2px; min-width: 80px; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
.mk-open { color: var(--ok); border-color: var(--ok); background: var(--ok-tint); }
.mk-halt { color: var(--bad); border-color: var(--bad); background: var(--bad-tint); }
.dash { display: grid; gap: 14px 22px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
@media (max-width: 760px) { .dash { grid-template-columns: 1fr; } }
.meter { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 2.2em; align-items: center; gap: 8px; font-size: 0.84rem; margin-bottom: 6px; }
.meter .bar { height: 8px; background: var(--line); border-radius: 1px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; transition: width 0.5s; background: var(--ok); }
.meter .bar i.warn { background: var(--warn); }
.meter .bar i.bad { background: var(--bad); }
.meter .v { font-family: var(--f-mono); text-align: right; }
.clks { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.clk { display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--line); background: var(--sheet); border-radius: 3px; padding: 4px 9px; font-size: 0.78rem; }
.clk b { font-family: var(--f-mono); font-weight: 500; }
.clk.warn { border-color: var(--warn); background: var(--warn-tint); }
.clk.bad { border-color: var(--bad); background: var(--bad-tint); color: var(--bad); }
.clk.done { opacity: 0.6; text-decoration: line-through; }
.clk.info { border-style: dashed; }

.step { border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); margin-bottom: 16px; }
.step > summary { cursor: pointer; padding: 11px 16px; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.step > summary::-webkit-details-marker { display: none; }
.step > summary .t { font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink-2); }
.step > summary h3 { font-size: 1rem; flex: 1 1 200px; }
.step-body { padding: 4px 16px 18px; display: grid; gap: 14px; }
.evt { border: 1px solid var(--line); background: var(--paper); border-radius: 3px; animation: rise 0.28s ease both; }
@keyframes rise { from { transform: translateY(6px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.evt-h { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; padding: 7px 12px; border-bottom: 1px solid var(--line); font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.evt-b { padding: 12px 14px; }
.evt-b p:last-child { margin-bottom: 0; }
.evt.sys { border-color: var(--bad); }
.evt.sys .evt-h { color: var(--bad); }
.prompt { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
.timer { font-family: var(--f-mono); font-size: 0.8rem; color: var(--warn); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 10px; text-align: left; background: var(--sheet); border: 1px solid var(--ink-2); border-radius: 3px; padding: 10px 12px; cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-tint); }
.opt .k { font-family: var(--f-mono); font-weight: 500; width: 1.7em; height: 1.7em; display: grid; place-items: center; border: 1px solid var(--ink-2); border-radius: 2px; }
.opt[disabled] { cursor: default; }
.opt.chosen { border-color: var(--accent); background: var(--accent-tint); }
.opt.best { border-color: var(--ok); }
.opt .tagline { display: block; margin-top: 6px; }
.opt.sel { border-color: var(--accent); background: var(--accent-tint); }
.opt.sel .k { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.is-right { border-color: var(--ok); background: var(--ok-tint); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-tint); }
.result { border: 1px solid var(--line); border-radius: 3px; padding: 14px; background: var(--paper); display: grid; gap: 10px; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; }
.lesson { background: var(--accent-tint); border-radius: 3px; padding: 12px 14px; }
.lesson p { margin-bottom: 0.5em; }
.lesson .tip { font-size: 0.9rem; color: var(--ink-2); }
.discuss { margin: 0; padding-left: 1.1em; }
details.sub > summary { cursor: pointer; font-weight: 600; }

/* debrief */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; justify-items: start; } }
.ring { width: 140px; height: 140px; }
.ring text { font-family: var(--f-display); font-weight: 700; fill: var(--ink); }
.skill { display: grid; grid-template-columns: 12em minmax(0, 1fr) 3em; gap: 8px; align-items: center; margin-bottom: 7px; font-size: 0.9rem; }
@media (max-width: 560px) { .skill { grid-template-columns: 1fr 3em; } .skill .bar { grid-column: 1 / -1; order: 3; } }
.skill .bar { height: 8px; background: var(--line); border-radius: 1px; overflow: hidden; }
.skill .bar i { display: block; height: 100%; background: var(--accent); }
.badge { border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; background: var(--sheet); }
.badge.on { border-color: var(--ok); background: var(--ok-tint); }
.badge:not(.on) { opacity: 0.6; }
.ripples { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ripples li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.88rem; min-width: 560px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-family: var(--f-mono); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }

/* toolkit */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.check.done span.tx { text-decoration: line-through; color: var(--ink-2); }
.pre { white-space: pre-wrap; font-family: var(--f-mono); font-size: 0.84rem; line-height: 1.6; background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 14px; overflow-x: auto; max-width: 100%; margin: 0; }
.copybox { width: 100%; min-height: 120px; font-family: var(--f-mono); font-size: 0.82rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 10px; }
footer.foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--ink-2); max-width: 78ch; }

.sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.step { scroll-margin-top: 120px; }

@media (max-width: 560px) { .brand span { display: none; } .clock { font-size: 1.25rem; } .hud { padding: 6px 0; } .hud-row { gap: 6px 10px; } .topbar { padding: 10px 0; } }

</style>
<div id="app"></div>
<script>
const SCEN = [];

/* ===== SCENARIO A — THE RANSOM NOTE ===== */
SCEN.push({
  id: 'ransom',
  title: 'The Ransom Note',
  tagline: 'Friday 18:04. Ransomware, stolen customer data and results week.',
  level: 'Intermediate',
  duration: '25–30 min',
  tags: ['Cyber incident', 'Bursa-first disclosure', 'PDPA clock', 'Insider control'],
  startDay: 'FRI',
  startMin: 18 * 60 + 4,
  endAt: 4600,
  brief: {
    role: 'Head of Corporate Communications',
    company: `<b>Tanjung Meridian Berhad (TMB)</b> is a fictional Main Market logistics and e-commerce fulfilment group with about 6,000 staff and hubs in Shah Alam, Penang and Kuching. A founding family controls it and a government-linked fund is a significant holder. TMB is <b>not</b> a bank and is <b>not</b> a designated national critical information infrastructure (NCII) entity.`,
    situation: `It is Friday evening at the start of a long weekend. Quarter-three results are targeted for Tuesday. The CEO is on a flight to Kuching and lands at 20:40. You are about to learn that the company is under attack.`,
    cast: [
      ['Dato’ Hafiz Rahman', 'Group CEO (in flight until 20:40)'],
      ['Encik Rahim Ismail', 'COO, acting Crisis Lead until the CEO lands'],
      ['Puan Lim Mei Ling', 'CFO'],
      ['Encik Faizal Ibrahim', 'Company Secretary'],
      ['Cik Priya Nair', 'General Counsel'],
      ['Encik Arif Zulkifli', 'Head of Investor Relations'],
      ['Mr Daniel Wong', 'CISO'],
      ['Puan Siti Aminah', 'Head of HR'],
      ['Tan Sri Dr Lee Boon Kiat', 'Chairman']
    ],
    objectives: [
      'Keep the circle of knowledge small and controlled.',
      'Start the right clocks and meet them.',
      'Tell the market first, truthfully, and everyone else straight after.',
      'Protect customers and staff without overpromising.'
    ]
  },
  clocks: {
    threat: { label: 'Attackers’ 48-hour deadline', short: 'Attackers', type: 'threat', due: 2880, miss: `The attackers’ 48-hour deadline passes. This is not a regulatory clock, but it sets the pace of the story.` },
    bursa: { label: 'Bursa announcement (pacing target: tonight)', short: 'Bursa', type: 'reg', due: 240, miss: `<b>Missed:</b> no Bursa announcement went out in the window. The rule is immediate disclosure of material information. By now a leak, a rumour or a question from the Exchange is more likely than not.`, m: [-6, -8, -3, 0, 8] },
    pdpc: { label: 'PDPC breach notification (72 hours)', short: 'PDPC', type: 'reg', due: 41 + 4320, miss: `<b>Missed:</b> the 72-hour window for notifying the Commissioner has lapsed. A late notification must come with a written explanation and evidence. Your own log shows when you knew.`, m: [-2, -9, -3, 0, 10] }
  },
  steps: [
    {
      id: 'a1', at: 0, title: 'The first call', market: 'CLOSED', level: 'L3',
      enter: { start: ['threat'] },
      inject: { channel: 'WhatsApp · CISO (direct)', from: 'Mr Daniel Wong', text: [
        `“Boss, ransom note on the ERP and the warehouse-management servers. Both are down. It says pay in 48 hours or they publish customer data. They attached a sample. It is real customer records. I have pulled the plug on the affected segment.”`

      skills: ['speed', 'gov'],
      prompt: `It is 18:04. The CEO is in the air. What do you do in the next ten minutes?`,
      options: [
        { id: 'a', q: 3, text: `Phone the Core Five and the CISO now. Open a phone bridge, move the war room off email and company chat, and ask the CISO to call the retained incident-response firm and the cyber insurer’s hotline.`, m: [2, 2, 0, 2, -2], set: ['core5', 'oob'], result: `By 18:20 the Core Five are on a bridge. The response firm is on the line and the insurer has issued a claim number. You start a decision log. Nothing has gone outside the room.` },
        { id: 'b', q: 1, text: `Create a big WhatsApp group with every senior manager and post the ransom-note screenshot so everyone is aware.`, m: [-2, 0, -2, -3, 4], set: ['leakyChannel'], result: `Forty people now hold a screenshot of the ransom note. Within the hour it has been forwarded outside the group. You have lost control of who knows what.` },
        { id: 'c', q: 0, text: `Email the full leadership team the ransom note and the data sample marked “URGENT – do not forward”.`, m: [-3, -2, -3, -4, 6], set: ['leakyChannel', 'emailed'], result: `The email lands on systems you can no longer trust. The data sample now sits in dozens of inboxes, and possibly in the attacker’s view.` },
        { id: 'd', q: 1, text: `Hold off telling anyone until IT confirms the full scope. You do not want to cause panic over a maybe.`, m: [-3, -2, 0, 0, 4], set: ['delay'], result: `Ninety minutes pass. By the time you convene, the CFO has heard from a vendor and two managers are speculating on WhatsApp.` }
      ],
      lesson: { ref: 'Playbook §2.1, §6.5, §6.6', why: `In the first hour the job is to reach the Core Five <b>by phone</b>, protect people and systems, and keep the circle small. In a cyber incident assume email and chat may be compromised, so use an agreed out-of-band channel. Delay and broadcast both create the leak risk you are trying to avoid.`, tip: `Keep a printed phone tree and a pre-agreed out-of-band channel in the war-room kit.` },
      discuss: [`Who is on your first call, and in what order?`, `What is your out-of-band channel if email and chat are down?`, `What changes if the CEO is unreachable for three hours?`]
    },
    {

        `“Before we go further. The Q3 numbers are locked in the ERP and Tuesday is our target. Who already knows? And is anyone allowed to trade? The market is closed, but it reopens on Monday.”`

      options: [

        { id: 'd', q: 2, text: `Send the do-not-trade notice to directors and senior management only.`, m: [1, 1, 0, 0, 0], set: ['insiderPartial'], result: `Better than nothing, but the response firm, the law firm and the agency were not covered, and they all know.` }
      ],

    {

      enter: { start: ['bursa', 'pdpc'] },
      inject: { channel: 'Phone · General Counsel', from: 'Cik Priya Nair', text: [
        `“The sample has names, mobile numbers and delivery addresses, thousands of them by the look of it. I need to know which clocks we start. Remember TMB is not a bank and is not designated as national critical information infrastructure. Pick what is real.”`
      ] },
      skills: ['disc'],
      type: 'multi',
      prompt: `Select every obligation or clock you start tonight, then confirm.`,
      options: [
        { id: '1', correct: true, text: `Bursa: assess materiality now and prepare an announcement`, why: `Material information must be disclosed immediately. The assessment starts now, not after the weekend.` },
        { id: '2', correct: true, text: `PDPC: personal data breach notification (72 hours)`, why: `Customer personal data is likely involved. The PDPA guideline sets 72 hours for a notifiable breach. Confirm thresholds with counsel.` },
        { id: '3', correct: true, text: `Insurer: notify the cyber policy`, why: `Policies usually require prompt notice and panel vendors.` },
        { id: '4', correct: true, text: `Lenders: check facility notification triggers`, why: `A major outage can touch information covenants. The CFO and Legal should read the documents tonight.` },
        { id: '5', correct: false, text: `NACSA: six-hour cyber incident report`, why: `That duty applies to designated NCII entities. TMB is not one here. Check whether your own company is.` },
        { id: '6', correct: false, text: `Bank Negara Malaysia: technology incident report`, why: `BNM duties apply to the institutions it regulates. TMB is not one.` },
        { id: '7', correct: false, text: `Securities Commission: file a market-misconduct report`, why: `No market misconduct has occurred. The SC is not the incident-notification desk for this.` },
        { id: '8', correct: false, text: `Tell all customers by SMS tonight`, why: `Customer notice matters, but it follows verified facts, the PDPC step and a plan. A blast SMS tonight without them creates a second crisis.` }
      ],
      multi: {
        high: { m: [3, 3, 2, 0, -4], set: ['clocksRight'], text: `The General Counsel nods: four real clocks, no wasted effort on duties that do not apply. Each now has an owner on the board.` },
        mid: { m: [1, 1, 0, 0, -1], set: [], text: `You have most of the picture, but some effort goes to the wrong places or a real obligation is missing from the board.` },

      },
      lesson: { ref: 'Playbook §2.3, §5.1–5.2', tag: 'C', why: `Match the obligation to the facts. PDPC (72 hours) and Bursa (immediately) apply here. NACSA applies to NCII entities and BNM to the financial institutions it regulates. Naming each clock and its owner is the discipline.`, tip: `Keep a pre-filled clock board for your own company’s licences and contracts.` },
      discuss: [`Which of these clocks apply to your company today?`, `Who owns each clock?`]
    },

    {

      inject: { channel: 'Call · Disclosure Committee', from: 'Puan Lim Mei Ling (CFO)', text: [
        `“Finance and the ERP are down, so we cannot close the quarter for Tuesday. The warehouse system is down too. We are sorting parcels by hand in Shah Alam and Penang. The attackers claim they have customer data.”`

      skills: ['disc', 'speed'],
      prompt: `Is this material, and when does Bursa hear about it?`,
      options: [
        { id: 'a', q: 3, text: `Treat it as potentially material. Run and document the materiality assessment, draft a factual Bursa announcement now, and release it tonight as soon as the facts are accurate rather than waiting for Monday’s open.`, m: [4, 5, 2, 0, -4], set: ['announceTonight', 't4'], result: `The Disclosure Committee logs its reasoning at 19:52 and the draft goes out for sign-off. You are on track to announce before the attackers can.` },
        { id: 'b', q: 1, text: `Assess it properly but hold the announcement until Monday pre-open to avoid a weekend news cycle.`, m: [-3, -3, -2, 0, 4], set: ['plannedMon', 't4'], result: `The reasoning is documented, but the attackers have a 48-hour clock and a Telegram channel. You have handed them control of the timing.` },
        { id: 'c', q: 0, text: `It is an IT matter. Operations continue manually, so it is not price-sensitive.`, m: [-5, -6, -3, 0, 8], set: ['notMaterial'], result: `You have no documented assessment and no draft. The facts say otherwise: a stalled quarter-end, stolen customer data and an extortion demand.` },
        { id: 'd', q: 0, text: `Call the two largest institutional holders first so they hear it from us, then decide on an announcement.`, m: [-4, -8, -3, 0, 9], set: ['selective'], result: `You have just made two institutions insiders with no announcement and no signed notice. If either trades, or the news leaks, you carry the exposure.` }
      ],
      lesson: { ref: 'Playbook §9.1–9.2, §9.6 · Main LR Para 9.03', tag: 'C', why: `Where it is arguable whether information is material, the presumption is in favour of disclosure. “Immediately” means as soon as an accurate announcement is possible. A closed market does not pause the duty, and the exception to immediate disclosure ends when a leak is likely. Briefing favoured investors first is selective disclosure.`, tip: `Document the reasoning (Template T4) even when you decide it is not material.` },
      discuss: [`What facts make this arguably material?`, `Why is “wait for Monday” riskier here than in a quiet week?`]
    },
    {
      id: 'a6', at: 125, title: 'Choose the holding statement', market: 'CLOSED', level: 'L3',
      inject: { channel: 'Draft · Comms team', from: 'Hana (Senior Executive, Comms)', text: [
        `“Four drafts of the holding statement. We need one by 21:00. Only state what is true at release.”`
      ] },
      skills: ['truth'],
      prompt: `Which draft goes forward?`,
      options: [
        { id: 'a', q: 0, text: `<i>“Tanjung Meridian Berhad experienced a minor, isolated IT disruption this evening. No customer data has been compromised and business continues as usual. As a matter of policy we do not comment on security matters.”</i>`, m: [-6, -6, -8, -2, 9], set: ['falseStatement'], result: `Within hours the attackers’ sample proves this false. “Minor” and “isolated” become the headline, and “no comment” reads as a cover-up.` },
        { id: 'b', q: 1, text: `<i>“TMB is the victim of a sophisticated attack by a foreign state-backed group using ‘Black Mandala’ ransomware through a vulnerable VPN at our Shah Alam data centre. We have blocked IP addresses 203.0.113.x. Customers should not worry.”</i>`, m: [-3, -3, -3, 0, 6], set: ['speculative'], result: `You named an attacker you cannot prove, handed the criminals technical detail and told customers not to worry about stolen data. Counsel is aghast.` },
        { id: 'c', q: 3, text: `<i>“On Friday at about 18:00 TMB detected a cyber security incident affecting some of our systems, including parts of our warehouse and finance systems. The people behind it claim to have obtained customer data; we are verifying that claim. We have isolated affected systems, engaged independent experts and are informing the relevant authorities. Parcel handling continues with some delays. If personal data is affected we will contact those concerned directly and comply with our legal obligations. Please rely on our official channels only: tmb.example/updates. Next update: Saturday 10:00.”</i>`, m: [4, 3, 5, 2, -3], set: ['honestStatement'], result: `Specific, calm and true. It acknowledges the claim, says what you are doing and when you will update. Journalists quote it as written.` },
        { id: 'd', q: 2, text: `<i>“TMB is investigating an IT incident affecting some systems. Our teams are working to restore services. We will share more information when appropriate.”</i>`, m: [-1, -1, -2, 0, 2], set: ['vagueStatement'], result: `Nothing false, but it omits the attackers’ claim and gives no next-update time. When the claim becomes public your statement looks evasive.` }
      ],
      lesson: { ref: 'Playbook §11.1–11.3 · Templates T7, T9', why: `Use the Five-Line Core Statement: acknowledge, care, action, accountability, next update. Avoid “isolated”, “minor”, “no comment”, speculation about attackers and technical detail that helps them. Never write “no evidence” when you hold evidence to the contrary.`, tip: `Check every claim in the draft against what is true at the minute of release.` },
      discuss: [`Which phrases would you strike from each draft?`, `What would you add to the best draft?`]
    },
    {
      id: 'a7', at: 165, title: 'Pay or not pay', market: 'CLOSED', level: 'L3',
      inject: { channel: 'Phone · Group CEO (just landed)', from: 'Dato’ Hafiz Rahman', text: [
        `“I have a friend whose firm paid and it went away. The response firm says they can make this disappear for a sum in crypto. The insurer has no objection. Do we pay tonight?”`
      ] },
      skills: ['gov'],
      prompt: `Who decides, and what happens tonight?`,
      options: [
        { id: 'a', q: 3, text: `No payment decision tonight. The Board decides after legal advice, including sanctions and law-enforcement consultation, and advice from the response firm. Tonight is for containment, restoration and customer protection.`, m: [1, 2, 0, 0, -3], set: ['ransomBoard'], result: `The CEO breathes out. A Board call is set for 10:00. Counsel starts the sanctions and law-enforcement check. Nobody has committed company money on a hunch.` },
        { id: 'b', q: 0, text: `Authorise payment tonight to stop the leak before the announcement goes out.`, m: [-4, -6, -4, 0, 10], set: ['paidRansom'], result: `There is no guarantee the data is deleted, and payment may raise sanctions or money-laundering issues. You have also committed the company without a Board decision.` },
        { id: 'c', q: 1, text: `Let the response firm open a channel to the attackers to buy time. Inform the Board afterwards.`, m: [0, -1, 0, 0, 4], set: ['quietNegotiation'], result: `Negotiating may be legitimate, but doing it first and telling the Board later flips the governance. The Chairman is unimpressed.` },
        { id: 'd', q: 1, text: `Defer to the insurer. They are the ones paying, after all.`, m: [0, -1, 0, 0, 3], set: ['insurerDecides'], result: `An insurer’s “no objection” is not a Board decision, and it does not address sanctions, law enforcement or the reputational question.` }
      ],
      lesson: { ref: 'Playbook §6.3 (ransom row), Scenario S1', why: `A ransom decision belongs to the Board after legal advice, law-enforcement consultation and insurer input. It is never delegated to IT or Comms, and it is never made in an airport phone call.`, tip: `Settle your ransom policy in peacetime.` },
      discuss: [`Who is in the room when the Board decides?`, `What does your insurance policy require before any negotiation?`]
    },

    {

(function () {

  const DAYS = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const stripTags = (s) => String(s).replace(/<[^>]*>/g, '').replace(/&amp;/g, '&');
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const pad = (n) => String(n).padStart(2, '0');

  /* ---- storage ---- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('fs:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('fs:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  let prog = store.get('progress', null) || { mods: {}, best: {}, check: {}, tree: null };
  const save = () => store.set('progress', prog);

  /* ---- formatting ---- */
  function simTime(scn, at) {
    const total = scn.startMin + at;
    const day = DAYS[(DAYS.indexOf(scn.startDay) + Math.floor(total / 1440)) % 7];
    const m = total % 1440;
    return `${day} ${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  }
  const fmtHM = (mins) => `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`;
  function fmtLeft(mins) {
    if (mins < 0) return 'OVERDUE';
    if (mins >= 1440) return `${Math.floor(mins / 1440)}d ${Math.floor((mins % 1440) / 60)}h`;
    if (mins >= 60) return `${Math.floor(mins / 60)}h ${pad(mins % 60)}m`;
    return `${mins}m`;
  }
  const qLabel = (q) => (q >= 2.5 ? 'Strong' : q >= 1.5 ? 'Reasonable' : q >= 0.5 ? 'Weak' : 'Risky');
  const qClass = (q) => (q >= 2.5 ? 'ok' : q >= 1.5 ? 'accent' : q >= 0.5 ? 'warn' : 'bad');
  const rankFor = (p) => (p >= 85 ? 'Crisis Captain' : p >= 70 ? 'War-Room Lead' : p >= 55 ? 'Steady Hand' : p >= 40 ? 'Learning Under Fire' : 'Back to the Drill');
  const tagChip = (t) => t ? `<span class="chip ${t === 'C' ? 'ok' : 'warn'}" title="${t === 'C' ? 'Corroborated by a secondary source during playbook research. Still confirm against official text.' : 'Verify with counsel. Not corroborated during playbook research.'}">${t === 'C' ? 'Corroborated' : 'Verify'}</span>` : '';

  function copyText(text, btn) {
    const holder = btn.parentElement;
    const done = () => { const o = btn.dataset.label || btn.textContent; btn.dataset.label = o; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = o; }, 1500); };
    const fallback = () => {
      let box = $('.copybox', holder);
      if (!box) { box = document.createElement('textarea'); box.className = 'copybox'; box.readOnly = true; box.setAttribute('aria-label', 'Select and copy this text'); holder.appendChild(box); }
      box.value = text; box.hidden = false; box.focus(); box.select();
      try { if (document.execCommand('copy')) done(); } catch (e) { /* manual copy */ }
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  /* ---- conditions ---- */
  function test(c, flags) {
    if (c === undefined || c === null) return true;
    if (Array.isArray(c)) return c.every((x) => test(x, flags));
    if (c[0] === '!') return !flags.has(c.slice(1));
    return flags.has(c);
  }
  function cond(o, flags) {
    if (o.if !== undefined && !test(o.if, flags)) return false;
    if (o.ifNot !== undefined) { const l = Array.isArray(o.ifNot) ? o.ifNot : [o.ifNot]; if (l.some((f) => flags.has(f))) return false; }
    if (o.any && !o.any.some((f) => flags.has(f))) return false;
    return true;
  }

  /* --- five-line builder --- */
  function builder(host) {
    const wrap = el(`<div class="sheet stack"><div class="eyebrow">Try it · Build the Five-Line Core Statement</div><p class="muted small" style="margin:0">Tap the lines in the order a first statement should run. Acknowledge, care, action, accountability, next.</p><div id="bpool" class="stack"></div><div><div class="eyebrow">Your statement</div><div class="slot" id="bslot" aria-live="polite"></div></div><div class="row"><button class="btn sm" id="bcheck">Check order</button><button class="btn ghost sm" id="bundo">Undo</button><button class="btn ghost sm" id="breset">Reset</button><span id="bres" class="small"></span></div></div>`);
    host.appendChild(wrap);
    let pool = shuffle(BUILDER_LINES), chosen = [];
    const draw = () => {
      $('#bpool', wrap).innerHTML = pool.map((l) => `<div class="bline"><button data-id="${l.id}">${esc(l.text)}</button></div>`).join('') || '<p class="muted small">All lines placed.</p>';

      $$('#bpool button', wrap).forEach((b) => b.onclick = () => { const l = pool.find((x) => x.id === +b.dataset.id); pool = pool.filter((x) => x !== l); chosen.push(l); $('#bres', wrap).textContent = ''; draw(); });
    };
    $('#bundo', wrap).onclick = () => { const l = chosen.pop(); if (l) pool.push(l); draw(); };
    $('#breset', wrap).onclick = () => { pool = shuffle(BUILDER_LINES); chosen = []; $('#bres', wrap).textContent = ''; draw(); };
    $('#bcheck', wrap).onclick = () => {
      const r = $('#bres', wrap);
      if (chosen.length < BUILDER_LINES.length) { r.textContent = 'Place all five lines first.'; return; }

      r.innerHTML = ok ? '<b style="color:var(--ok)">Correct order.</b> Acknowledge, care, action, accountability, next.' : '<b style="color:var(--bad)">Not yet.</b> The order is: ' + BUILDER_LINES.map((l) => l.role).join(', ') + '.';

    draw();
  }

      };
    }
    draw();
  }

        <label class="row" style="gap:8px"><input type="radio" name="mode" value="group"> <span><b>Facilitated, for a team.</b> Discuss each decision, then reveal the expert view. No scoring.</span></label>
        <label class="row" style="gap:8px"><input type="checkbox" id="pressure"> <span>Pressure timer: 75 seconds per decision (solo only)</span></label>
      </div>
      <div class="row"><button class="btn" id="begin">Begin the scenario</button><button class="btn ghost" id="copyguide">Copy facilitator guide</button></div>`;
    $('#begin', root.sim).onclick = () => startGame(s, $('input[name="mode"]:checked', root.sim).value, $('#pressure', root.sim).checked);
    $('#copyguide', root.sim).onclick = (e) => copyText(facilitatorGuide(s), e.currentTarget);
    window.scrollTo(0, 0);
  }

  function facilitatorGuide(s) {
    const L = [];
    L.push(`FACILITATOR GUIDE: ${s.title}`, s.tagline, '', s.facilitator.intro, `Materials: ${s.facilitator.materials}`, '', `Role: ${s.brief.role}`, `Objectives:`);
    s.brief.objectives.forEach((o) => L.push(`- ${o}`));
    L.push('', 'Reminder: fictional scenario. Regulatory points follow the playbook and need counsel review.', '');
    s.steps.forEach((st, i) => {
      L.push(`--- Step ${i + 1}: ${st.title} (${simTime(s, st.at)}) ---`);
      st.inject.text.forEach((t) => L.push(stripTags(t)));
      (st.variants || []).forEach((v) => v.text.forEach((t) => L.push(`[If ${v.if || 'not ' + v.ifNot}] ${stripTags(t)}`)));
      L.push(`Ask: ${st.prompt}`);
      st.options.forEach((o, n) => {
        if (st.type === 'multi') L.push(`  ${o.correct ? '[YES]' : '[NO ]'} ${stripTags(o.text)}: ${stripTags(o.why)}`);
        else L.push(`  ${String.fromCharCode(65 + n)}. ${o.q === 3 ? '[BEST] ' : ''}${stripTags(o.text)} (${qLabel(o.q)}) → ${stripTags(o.result)}`);
      });
      L.push(`Why: ${stripTags(st.lesson.why)}`, `Tip: ${stripTags(st.lesson.tip || '')}`, `Playbook: ${st.lesson.ref}`, 'Discuss:');
      st.discuss.forEach((d) => L.push(`  - ${d}`));
      L.push('');
    });
    return L.join('\n');
  }

  function startGame(scn, mode, pressure) {
    const flags = new Set();
    const clk = {}; Object.keys(scn.clocks).forEach((k) => { clk[k] = { started: false, done: false, missed: false }; });
    const sk = {}; Object.keys(SKILLS).forEach((k) => { sk[k] = { sum: 0, n: 0 }; });
    G = { scn, mode, pressure: pressure && mode === 'solo', i: -1, at: 0, cur: null, meters: { market: 60, reg: 60, pub: 60, staff: 60, legal: 30 }, flags, clk, sk, total: 0, count: 0, log: [], sys: [], order: {}, timer: null };
    root.sim.innerHTML = `<div class="hud" id="hud"></div><div id="dash"></div><div id="steps"></div><div id="live" class="sr" aria-live="polite" style="position:absolute;left:-9999px"></div>`;
    $('#hud', root.sim).addEventListener('click', (e) => {
      const b = e.target.closest('[data-act="exit"]'); if (!b) return;
      if (b.dataset.arm) { stopTimer(); renderSimMenu(); window.scrollTo(0, 0); } else { b.dataset.arm = '1'; b.textContent = 'Confirm exit'; setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.textContent = 'Exit'; } }, 3000); }
    });
    enterStep(0);
  }

  const hudOffset = () => { const h = $('#hud', root.sim); return (h ? h.offsetHeight : 90) + 14; };
  const marketFor = (st, flags) => { let v = st.market; (st.marketIf || []).forEach((m) => { if (flags.has(m.if)) v = m.val; }); return v; };
  const levelClass = (l) => (l === 'L4' ? 'bad' : l === 'L3' ? 'warn' : l === 'L2' ? 'accent' : 'ok');

  function renderHud() {
    const s = G.scn, st = G.cur; if (!st) return;
    const mk = marketFor(st, G.flags);
    const mkc = mk === 'OPEN' ? 'mk-open' : mk === 'HALTED' ? 'mk-halt' : '';
    $('#hud', root.sim).innerHTML = `<div class="hud-row"><div class="clock" aria-label="Scenario time">${simTime(s, G.at)}<small>T+${fmtHM(G.at)}</small></div><span class="chip ${mkc}">Market ${mk}</span><span class="chip ${levelClass(st.level)}">Level ${st.level.slice(1)}</span><div class="prog" aria-hidden="true"><i style="width:${(G.i / s.steps.length) * 100}%"></i></div><span class="mono small">Step ${G.i + 1} / ${s.steps.length}</span><button class="btn ghost sm" data-act="exit">Exit</button></div>`;
    renderDash();
  }

  function renderDash() {
    const d = $('#dash', root.sim); if (G.mode !== 'solo') { d.innerHTML = ''; return; }
    const meters = METERS.map((m) => {
      const v = clamp(Math.round(G.meters[m.id]), 0, 100); const good = m.invert ? 100 - v : v;
      const cls = good >= 55 ? '' : good >= 35 ? 'warn' : 'bad';
      return `<div class="meter"><span>${m.name}</span><div class="bar" role="img" aria-label="${m.name} ${v} out of 100"><i class="${cls}" style="width:${v}%"></i></div><span class="v">${v}</span></div>`;
    }).join('');
    const clocks = Object.keys(G.scn.clocks).filter((id) => G.clk[id].started).map((id) => {
      const def = G.scn.clocks[id], c = G.clk[id]; const left = def.due - G.at;
      let cls = 'clk', txt;
      if (c.done) { cls += ' done'; txt = 'done'; }
      else if (def.type === 'info') { cls += ' info'; txt = left > 0 ? fmtLeft(left) : 'now'; }
      else if (c.missed) { cls += ' bad'; txt = 'OVERDUE'; }
      else { txt = fmtLeft(left); if (left < 60) cls += ' warn'; }
      return `<span class="${cls}">${esc(def.short)} <b>${txt}</b></span>`;
    }).join('') || '<span class="muted small">No clocks running yet.</span>';
    d.innerHTML = `<details class="sheet tight" open style="margin-bottom:14px"><summary class="eyebrow" style="cursor:pointer">Dashboard · meters and clocks</summary><div class="dash" style="margin-top:10px"><div>${meters}</div><div><div class="eyebrow" style="margin-bottom:6px">Clock board</div><div class="clks">${clocks}</div></div></div></details>`;
  }

  function startClock(id) { const c = G.clk[id]; if (c && !c.started) c.started = true; }

  function applyM(arr) {
    if (!arr) return [];
    const keys = ['market', 'reg', 'pub', 'staff', 'legal'];
    arr.forEach((d, i) => { G.meters[keys[i]] = clamp(G.meters[keys[i]] + d, 0, 100); });
    return arr;
  }
  function deltaChips(arr) {
    const keys = METERS;
    return arr.map((d, i) => { if (!d) return ''; const good = keys[i].invert ? d < 0 : d > 0; return `<span class="chip ${good ? 'ok' : 'bad'}">${keys[i].name} ${d > 0 ? '+' : ''}${d}</span>`; }).join('');
  }

  function checkClocks(at) {
    const out = [];
    Object.keys(G.scn.clocks).forEach((id) => {
      const def = G.scn.clocks[id], c = G.clk[id];
      if (!c.started || c.done || c.missed || def.type === 'info') return;
      if (def.due <= at) {
        c.missed = true; G.flags.add('missed_' + id);
        if (def.type === 'reg' || def.type === 'soft') { G.flags.add('anyMissed'); applyM(def.m); }
        if (def.type === 'threat') G.flags.add('threatPassed');
        out.push(def);
      }
    });
    return out;
  }

  function enterStep(i) {
    const s = G.scn, st = s.steps[i];
    G.i = i; G.at = st.at; G.cur = st;
    ((st.enter && st.enter.start) || []).forEach(startClock);
    const sys = G.mode === 'solo' ? checkClocks(G.at) : [];
    const sec = el(`<details class="step" open id="step${i}"><summary><span class="t">${simTime(s, G.at)} · Step ${i + 1} of ${s.steps.length}</span><h3>${esc(st.title)}</h3><span class="chip" data-slot>In progress</span></summary><div class="step-body"></div></details>`);
    const body = $('.step-body', sec);
    sys.forEach((def) => body.appendChild(el(`<div class="evt sys"><div class="evt-h"><span>System · clock</span><span>${simTime(s, G.at)}</span></div><div class="evt-b"><p>${def.miss || ''}</p></div></div>`)));
    const paras = st.inject.text.concat(...(st.variants || []).filter((v) => cond(v, G.flags)).map((v) => v.text));
    body.appendChild(el(`<div class="evt"><div class="evt-h"><span>${esc(st.inject.channel)}</span><span>${esc(st.inject.from)} · ${simTime(s, G.at)}</span></div><div class="evt-b">${paras.map((p) => `<p>${p}</p>`).join('')}</div></div>`));
    const dec = el(`<div class="stack" id="dec${i}"></div>`);
    body.appendChild(dec);
    $('#steps', root.sim).appendChild(sec);
    renderHud();
    sec.style.scrollMarginTop = hudOffset() + 'px';
    const live = $('#live', root.sim); if (live) live.textContent = `Step ${i + 1}: ${st.title}`;
    if (st.type === 'multi') renderMulti(st, dec, sec); else renderSingle(st, dec, sec);
    if (G.pressure) startTimer(st, dec, sec);
    setTimeout(() => sec.scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' }), 30);
  }

  /* --- timer --- */
  function stopTimer() { if (G && G.timer) { clearInterval(G.timer); G.timer = null; } }
  function startTimer(st, dec, sec) {
    stopTimer();
    let left = 75;
    const t = el(`<div class="timer" aria-hidden="true">Pressure timer: <b>${left}s</b></div>`);
    dec.insertBefore(t, dec.firstChild);
    G.timer = setInterval(() => {
      if (document.hidden || root.sim.hidden) return;
      left--; t.innerHTML = `Pressure timer: <b>${Math.max(left, 0)}s</b>`;
      if (left <= 0) { stopTimer(); t.textContent = 'Time ran out. The passive choice was made for you.'; if (st.type === 'multi') $('#submitMulti', dec) && $('#submitMulti', dec).click(); else { const o = st.options.slice().sort((a, b) => a.q - b.q)[0]; const b = $(`[data-oid="${o.id}"]`, dec); if (b) b.click(); } }
    }, 1000);
  }

  /* --- single choice --- */
  function renderSingle(st, dec, sec) {
    const i = G.i;
    const order = G.order[st.id] || (G.order[st.id] = shuffle(st.options.map((o) => o.id)));
    const opts = order.map((id) => st.options.find((o) => o.id === id));
    dec.insertAdjacentHTML('beforeend', `<div class="prompt">${esc(st.prompt)}</div><div class="opts">${opts.map((o, n) => `<button class="opt" data-oid="${o.id}"><span class="k">${String.fromCharCode(65 + n)}</span><span>${o.text}</span></button>`).join('')}</div>`);
    if (G.mode === 'group') {
      $$('.opt', dec).forEach((b) => { b.disabled = true; });
      dec.insertAdjacentHTML('beforeend', `<div class="row"><button class="btn" id="reveal${i}">Reveal expert view</button></div><div id="out${i}"></div>`);
      $(`#reveal${i}`, dec).onclick = (e) => {
        e.currentTarget.disabled = true;
        const best = st.options.reduce((a, b) => (b.q > a.q ? b : a));
        $$('.opt', dec).forEach((b) => { if (b.dataset.oid === best.id) b.classList.add('best'); });
        const out = $(`#out${i}`, dec);
        out.innerHTML = `<div class="result"><div class="eyebrow">If the room chose…</div>${opts.map((o, n) => `<div><span class="chip ${qClass(o.q)}">${String.fromCharCode(65 + n)} · ${qLabel(o.q)}</span> ${o.result}</div>`).join('')}</div>${lessonHtml(st)}${discussHtml(st)}<div class="row"><button class="btn" id="next${i}">${i + 1 < G.scn.steps.length ? 'Next step' : 'Finish session'}</button></div>`;
        $(`#next${i}`, out).onclick = () => { collapse(sec, 'Discussed'); next(); };
      };
      return;
    }
    $$('.opt', dec).forEach((b) => b.onclick = () => chooseSingle(st, b.dataset.oid, dec, sec));
  }

  const lessonHtml = (st) => `<div class="lesson"><div class="row" style="margin-bottom:6px"><span class="chip accent">${esc(st.lesson.ref)}</span>${tagChip(st.lesson.tag)}</div><p>${st.lesson.why}</p>${st.lesson.tip ? `<p class="tip">Tip: ${st.lesson.tip}</p>` : ''}</div>`;
  const discussHtml = (st) => `<details class="sub sheet tight"><summary>Discussion prompts</summary><ul class="discuss">${st.discuss.map((d) => `<li>${esc(d)}</li>`).join('')}</ul></details>`;

  function collapse(sec, label, q) {
    const chip = $('[data-slot]', sec); if (chip) { chip.className = 'chip ' + (q === undefined ? '' : qClass(q)); chip.textContent = label; }
    sec.open = false;
  }

  function chooseSingle(st, oid, dec, sec) {
    stopTimer();
    const i = G.i, o = st.options.find((x) => x.id === oid);
    const best = st.options.reduce((a, b) => (b.q > a.q ? b : a));
    $$('.opt', dec).forEach((b) => { b.disabled = true; if (b.dataset.oid === oid) b.classList.add('chosen'); if (b.dataset.oid === best.id) b.classList.add('best'); });
    const before = new Set(G.flags);
    let m = (o.m || [0, 0, 0, 0, 0]).slice(); const notes = [];
    (o.mods || []).forEach((md) => { if (cond(md, before)) { (md.m || []).forEach((d, n) => { m[n] += d; }); if (md.note) notes.push(md.note); } });
    applyM(m);
    (o.set || []).forEach((f) => G.flags.add(f));
    (o.start || []).forEach(startClock);
    (o.done || []).forEach((id) => { if (G.clk[id]) G.clk[id].done = true; });
    st.skills.forEach((k) => { G.sk[k].sum += o.q; G.sk[k].n++; });
    G.total += o.q; G.count++;
    G.log.push({ step: st, picked: o, q: o.q, best });
    renderHud();
    const out = el(`<div class="result" id="out${i}"><div class="row"><span class="chip ${qClass(o.q)}">${qLabel(o.q)}</span><span class="small muted">You chose: ${esc(stripTags(o.text).slice(0, 90))}${stripTags(o.text).length > 90 ? '…' : ''}</span></div><p style="margin:0">${o.result}</p>${notes.map((n) => `<p style="margin:0"><b>Because of an earlier choice:</b> ${n}</p>`).join('')}<div class="deltas">${deltaChips(m)}</div>${o.q < 3 ? `<div class="small"><b>Strongest move:</b> ${best.text}</div>` : ''}${lessonHtml(st)}<div class="row"><button class="btn" id="next${i}">${i + 1 < G.scn.steps.length ? 'Continue' : 'See the debrief'}</button></div></div>`);
    dec.appendChild(out);
    $(`#next${i}`, out).onclick = () => { collapse(sec, qLabel(o.q), o.q); next(); };
    out.style.scrollMarginTop = hudOffset() + 'px';
    out.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
  }

  /* --- multi select --- */
  function renderMulti(st, dec, sec) {
    const i = G.i;
    const order = G.order[st.id] || (G.order[st.id] = shuffle(st.options.map((o) => o.id)));
    const opts = order.map((id) => st.options.find((o) => o.id === id));
    dec.insertAdjacentHTML('beforeend', `<div class="prompt">${esc(st.prompt)}</div><div class="opts" id="mo${i}">${opts.map((o) => `<label class="opt" data-oid="${o.id}"><span class="k"><input type="checkbox" id="mc${i}_${o.id}" value="${o.id}" style="margin:0"></span><span>${o.text}</span></label>`).join('')}</div>`);
    const box = $(`#mo${i}`, dec);
    $$('input', box).forEach((c) => c.onchange = () => c.closest('.opt').classList.toggle('sel', c.checked));
    if (G.mode === 'group') {
      dec.insertAdjacentHTML('beforeend', `<div class="row"><button class="btn" id="reveal${i}">Reveal expert view</button></div><div id="out${i}"></div>`);
      $(`#reveal${i}`, dec).onclick = (e) => {
        e.currentTarget.disabled = true;
        $$('.opt', box).forEach((l) => { const o = st.options.find((x) => x.id === l.dataset.oid); l.classList.add(o.correct ? 'is-right' : 'is-wrong'); $('input', l).disabled = true; });
        const out = $(`#out${i}`, dec);
        out.innerHTML = `<div class="result">${opts.map((o) => `<div><span class="chip ${o.correct ? 'ok' : 'bad'}">${o.correct ? 'Yes' : 'No'}</span> <b>${stripTags(o.text)}</b>: ${o.why}</div>`).join('')}</div>${lessonHtml(st)}${discussHtml(st)}<div class="row"><button class="btn" id="next${i}">${i + 1 < G.scn.steps.length ? 'Next step' : 'Finish session'}</button></div>`;
        $(`#next${i}`, out).onclick = () => { collapse(sec, 'Discussed'); next(); };
      };
      return;
    }
    dec.insertAdjacentHTML('beforeend', `<div class="row"><button class="btn" id="submitMulti">Confirm selection</button></div>`);
    $('#submitMulti', dec).onclick = (e) => {
      stopTimer(); e.currentTarget.disabled = true;
      const sel = new Set($$('input:checked', box).map((c) => c.value));
      const tc = st.options.filter((o) => o.correct).length;
      let cs = 0, ws = 0;
      st.options.forEach((o) => { if (sel.has(o.id)) { if (o.correct) cs++; else ws++; } });
      const score = clamp((cs - ws) / tc, 0, 1), q = Math.round(score * 3 * 100) / 100;
      const tier = score >= 0.85 ? 'high' : score >= 0.5 ? 'mid' : 'low';
      const T = st.multi[tier];
      $$('.opt', box).forEach((l) => { const o = st.options.find((x) => x.id === l.dataset.oid); $('input', l).disabled = true; l.classList.remove('sel'); const on = sel.has(o.id); if (o.correct) l.classList.add('is-right'); else if (on) l.classList.add('is-wrong'); });
      const m = (T.m || [0, 0, 0, 0, 0]).slice(); applyM(m);
      (T.set || []).forEach((f) => G.flags.add(f));
      st.options.forEach((o) => { if (sel.has(o.id)) { (o.start || []).forEach(startClock); (o.done || []).forEach((id) => { if (G.clk[id]) G.clk[id].done = true; }); } });
      st.skills.forEach((k) => { G.sk[k].sum += q; G.sk[k].n++; });
      G.total += q; G.count++;
      const missedRight = st.options.filter((o) => o.correct && !sel.has(o.id));
      G.log.push({ step: st, picked: { text: `${cs} of ${tc} correct${ws ? `, ${ws} wrong` : ''}` }, q, best: { text: 'Select all real obligations and none of the distractors.' } });
      renderHud();
      const out = el(`<div class="result" id="out${i}"><div class="row"><span class="chip ${qClass(q)}">${qLabel(q)}</span><span class="small muted">${cs} of ${tc} real obligations found${ws ? `, ${ws} that do not apply` : ''}</span></div><p style="margin:0">${T.text}</p><div class="deltas">${deltaChips(m)}</div>${missedRight.length ? `<div class="small"><b>Missed:</b> ${missedRight.map((o) => stripTags(o.text)).join('; ')}</div>` : ''}<details class="sub"><summary>Why each one</summary><ul class="points">${st.options.map((o) => `<li><b>${o.correct ? 'Yes' : 'No'}.</b> ${stripTags(o.text)}: ${o.why}</li>`).join('')}</ul></details>${lessonHtml(st)}<div class="row"><button class="btn" id="next${i}">${i + 1 < G.scn.steps.length ? 'Continue' : 'See the debrief'}</button></div></div>`);
      dec.appendChild(out);
      $(`#next${i}`, out).onclick = () => { collapse(sec, qLabel(q), q); next(); };
      out.style.scrollMarginTop = hudOffset() + 'px';
      out.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
    };
  }

  function next() {
    if (G.i + 1 < G.scn.steps.length) enterStep(G.i + 1); else finish();
  }

  /* --- debrief --- */
  function finish() {
    stopTimer();
    const s = G.scn;
    if (G.mode === 'group') return finishGroup();
    const lateClocks = checkClocks(s.endAt);
    G.at = s.endAt; renderDash();
    const pct = Math.round((100 * G.total) / (3 * G.count));
    const rank = rankFor(pct);
    const skills = Object.keys(SKILLS).map((k) => ({ k, name: SKILLS[k].name, n: G.sk[k].n, pct: G.sk[k].n ? Math.round((100 * G.sk[k].sum) / (3 * G.sk[k].n)) : null }));
    const earned = s.badges.filter((b) => test(b.if, G.flags));
    const ripples = s.ripples.filter((r) => cond(r, G.flags));
    const weak = skills.filter((x) => x.pct !== null && x.pct < 75).sort((a, b) => a.pct - b.pct).slice(0, 2);
    const recMods = [...new Set(weak.flatMap((w) => SKILLS[w.k].mods))].slice(0, 3).map((id) => MODULES.find((m) => m.id === id));
    const prev = prog.best[s.id];
    if (!prev || pct > prev.pct) { prog.best[s.id] = { pct, rank, badges: earned.map((b) => b.id) }; save(); }
    const circ = 2 * Math.PI * 56, dash = (pct / 100) * circ;
    const meters = METERS.map((m) => { const v = clamp(Math.round(G.meters[m.id]), 0, 100); const good = m.invert ? 100 - v : v; return `<div class="meter"><span>${m.name}</span><div class="bar"><i class="${good >= 55 ? '' : good >= 35 ? 'warn' : 'bad'}" style="width:${v}%"></i></div><span class="v">${v}</span></div>`; }).join('');
    const summary = [`FIRST SIXTY: ${s.title}`, `Score ${pct}% (${rank})`, ...skills.filter((x) => x.pct !== null).map((x) => `${x.name}: ${x.pct}%`), `Badges: ${earned.map((b) => b.name).join(', ') || 'none'}`].join('\n');
    root.sim.innerHTML = `
      <div class="row"><span class="eyebrow">Debrief · ${esc(s.title)}</span></div>
      <section class="sheet score"><svg class="ring" viewBox="0 0 140 140" role="img" aria-label="Score ${pct} percent"><circle cx="70" cy="70" r="56" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="70" cy="70" r="56" fill="none" stroke="var(--accent)" stroke-width="12" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 70 70)"/><text x="70" y="78" text-anchor="middle" font-size="32">${pct}%</text></svg><div class="stack"><h2>${esc(rank)}</h2><p class="muted" style="margin:0">${pct >= 85 ? 'Calm, disciplined and Bursa-first. You would be a good person to have in the room.' : pct >= 70 ? 'Strong instincts with a few gaps. The review below shows exactly where.' : pct >= 55 ? 'Solid base. A couple of the traps caught you. Study the modules suggested below and run it again.' : 'This is what drills are for. Read the review, study the suggested modules and replay.'}</p><div class="row"><button class="btn" data-brief="${s.id}">Replay</button><button class="btn ghost" data-act="sim-menu">Other scenarios</button><button class="btn ghost" id="copysum">Copy my result</button></div></div></section>
      ${lateClocks.length ? `<section class="sheet stack"><div class="eyebrow">Still open at the end</div>${lateClocks.map((d) => `<p style="margin:0">${d.miss}</p>`).join('')}</section>` : ''}
      <section class="grid g2"><div class="sheet stack"><h3>Skills</h3>${skills.map((x) => x.pct === null ? '' : `<div class="skill"><span>${x.name}</span><div class="bar"><i style="width:${x.pct}%"></i></div><span class="mono">${x.pct}%</span></div>`).join('')}</div><div class="sheet stack"><h3>Where the company ended up</h3>${meters}</div></section>
      <section class="stack"><h3>Badges</h3><div class="grid g3">${s.badges.map((b) => `<div class="badge ${earned.includes(b) ? 'on' : ''}"><b>${esc(b.name)}</b><br><span class="small muted">${esc(b.desc)}</span><br><span class="chip ${earned.includes(b) ? 'ok' : ''}" style="margin-top:6px">${earned.includes(b) ? 'Earned' : 'Not earned'}</span></div>`).join('')}</div></section>
      <section class="sheet stack"><h3>Ripple effects of your choices</h3>${ripples.length ? `<ul class="ripples">${ripples.map((r) => `<li><span class="chip ${r.tone === 'good' ? 'ok' : 'bad'}">${r.tone === 'good' ? 'Helped' : 'Hurt'}</span><span>${r.text}</span></li>`).join('')}</ul>` : '<p class="muted">No major ripples.</p>'}</section>
      <section class="stack"><h3>Decision review</h3><div class="sheet tbl"><table><thead><tr><th>Step</th><th>Your decision</th><th>Rating</th><th>Strongest move</th><th>Playbook</th></tr></thead><tbody>${G.log.map((l, n) => `<tr><td>${n + 1}. ${esc(l.step.title)}</td><td>${esc(stripTags(l.picked.text).slice(0, 110))}${stripTags(l.picked.text).length > 110 ? '…' : ''}</td><td><span class="chip ${qClass(l.q)}">${qLabel(l.q)}</span></td><td>${l.q >= 3 ? '<span class="muted">Same</span>' : esc(stripTags(l.best.text).slice(0, 140)) + (stripTags(l.best.text).length > 140 ? '…' : '')}</td><td>${esc(l.step.lesson.ref)}</td></tr>`).join('')}</tbody></table></div></section>
      ${recMods.length ? `<section class="stack"><h3>Study next</h3><p class="muted">Your lowest skills: ${weak.map((w) => `${w.name} (${w.pct}%)`).join(', ')}.</p><div class="grid g3">${recMods.map((m) => `<button class="mod" data-mod="${m.id}"><span class="n">ACADEMY · ${m.mins} MIN</span><h3>${esc(m.title)}</h3><span class="muted small">${esc(m.blurb)}</span></button>`).join('')}</div></section>` : `<section class="notice"><b>No weak skills flagged.</b> Try the pressure timer, or run the other scenarios.</section>`}`;
    $('#copysum', root.sim).onclick = (e) => copyText(summary, e.currentTarget);
    window.scrollTo(0, 0);
  }

  function finishGroup() {
    const s = G.scn;
    root.sim.innerHTML = `
      <div class="row"><span class="eyebrow">Session complete · ${esc(s.title)}</span></div>
      <section class="sheet stack"><h2>Key takeaways</h2><ul class="points">${s.steps.map((st) => `<li><b>${esc(st.title)}.</b> ${st.lesson.why} <span class="chip accent">${esc(st.lesson.ref)}</span></li>`).join('')}</ul></section>
      <div class="row"><button class="btn" id="copyg">Copy facilitator guide</button><button class="btn ghost" data-brief="${s.id}">Run again</button><button class="btn ghost" data-act="sim-menu">Other scenarios</button></div>`;
    $('#copyg', root.sim).onclick = (e) => copyText(facilitatorGuide(s), e.currentTarget);
    window.scrollTo(0, 0);
  }

  /* ===================== BOOT ===================== */
  function boot() {
    const app = $('#app');
    app.innerHTML = `
      <header class="topbar"><button class="brand" data-go="home" aria-label="First Sixty home">First Sixty <span>Crisis drills · Malaysian PLCs</span></button>
      <nav class="nav" aria-label="Sections"><button data-v="home" data-go="home">Home</button><button data-v="academy" data-go="academy">Academy</button><button data-v="sim" data-go="sim">Simulator</button><button data-v="toolkit" data-go="toolkit">Toolkit</button></nav></header>
      <main>${VIEWS.map((v) => `<section class="view" id="v-${v}" hidden></section>`).join('')}</main>
      <footer class="foot">Training tool and fiction. Companies, people and events are invented. Regulatory points follow the Crisis Communications Playbook for Malaysian PLCs (drafted 14 October 2026) and were checked against secondary sources only. Confirm with counsel before relying on them. Progress is saved in this browser only.</footer>`;
    VIEWS.forEach((v) => { root[v] = $('#v-' + v); });
    renderAcademy(); renderToolkit(); renderSimMenu();
    document.addEventListener('click', (e) => {
      const t = e.target.closest('[data-go],[data-mod],[data-brief],[data-act]'); if (!t) return;
      if (t.dataset.act === 'exit') return;
      if (t.dataset.mod) { go('academy'); openModule(t.dataset.mod); return; }
      if (t.dataset.brief) { go('sim'); renderBrief(t.dataset.brief); return; }
      if (t.dataset.act === 'acad-back') { renderAcademy(); window.scrollTo(0, 0); return; }
      if (t.dataset.act === 'sim-menu') { stopTimer(); renderSimMenu(); window.scrollTo(0, 0); return; }
      if (t.dataset.go) { go(t.dataset.go); if (t.dataset.go === 'academy' && !$('#modgrid', root.academy)) renderAcademy(); }
    });
    show(location.hash.slice(1) || 'home');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
